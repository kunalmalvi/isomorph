# ISOMORPH local stack. Not executed in the authoring sandbox (Docker unavailable there): UNVERIFIED.
# Usage: cp .env.example .env && docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-isomorph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-isomorph}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isomorph} -d ${POSTGRES_DB:-isomorph}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", "alembic upgrade head && uvicorn api.main:create_app --factory --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-isomorph}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-isomorph}
      ISOMORPH_ENV: ${ISOMORPH_ENV:-development}
      ISOMORPH_SECRET_KEY: ${ISOMORPH_SECRET_KEY:-dev-only-secret-change-me-0123456789abcdef}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      USE_PGVECTOR: ${USE_PGVECTOR:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Read by the browser, so it must be reachable from the user's machine, not only from inside Docker.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
